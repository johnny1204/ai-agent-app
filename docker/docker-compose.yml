# docker-compose.yml の使い方:
#
#   # 全サービス起動
#   docker compose -f docker/docker-compose.yml up
#
#   # study-assistant 開発サーバー起動
#   docker compose -f docker/docker-compose.yml up study-assistant

services:
  web:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - ../app:/usr/share/nginx/html

  study-assistant:
    image: node:20-bookworm
    working_dir: /app/study-assistant
    ports:
      - "3000:3000"
    volumes:
      - ../:/app
    command: npm run dev
